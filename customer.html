<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=index.html?view=account">
  <title>Redirecting to GrossHub Store & Account Portal...</title>
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script>
    // Immediate redirect to unified storefront & customer account portal
    window.location.replace("index.html?view=account");
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .redirect-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 36px 28px;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e2e8f0;
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { margin: 0 0 8px 0; font-size: 1.35rem; font-weight: 800; color: #0f172a; }
    p { margin: 0 0 20px 0; color: #64748b; font-size: 0.9rem; line-height: 1.5; }
    .btn-redirect {
      display: inline-block;
      background: #10b981;
      color: #ffffff;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 10px;
      text-decoration: none;
      transition: background 0.2s ease;
    }
    .btn-redirect:hover { background: #059669; }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="spinner"></div>
    <h2>Redirecting to GrossHub</h2>
    <p>Customer accounts and grocery orders are now united in the main GrossHub storefront.</p>
    <a href="index.html?view=account" class="btn-redirect">Open Account Portal ➔</a>
  </div>
</body>
</html>
